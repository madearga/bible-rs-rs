#
# Continuous integration for the Bible reader. Every pull request is checked on
# Linux and macOS. The Linux job builds, formats, lints, tests, smokes the
# search command, runs the search benchmark, and renders one frame headless
# under Xvfb. The macOS job repeats the checks, builds and verifies the app
# bundle, renders one frame, and uploads the bundle and the shot for a
# reviewer.
#
# Every action is pinned to a 40 character commit SHA with the version in a
# comment beside it. The workflow fails on the first failing step.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: Linux build, checks, and headless render
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - name: Install the system libraries the GUI needs
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            xvfb \
            mesa-utils \
            x11-utils

      - name: Cache the cargo registry and the build directory
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check the formatting
        run: cargo fmt --all --check

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run the test suite
        run: cargo test --workspace

      - name: Smoke the search command against the release binary
        run: cargo run --release -p bible-app -- search "love one another" --limit 3

      - name: Run the search benchmark
        run: cargo bench -p bible-core --bench search -- --warm-up-time 1 --measurement-time 2

      - name: Render one frame headless under Xvfb
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          for _ in $(seq 1 50); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          cargo run --release --example shot -- /tmp/ci-shot.png 1280x800
          test -s /tmp/ci-shot.png
          ls -l /tmp/ci-shot.png

      - name: Upload the rendered frame
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-ci-shot
          path: /tmp/ci-shot.png
          if-no-files-found: error

  macos:
    name: macOS bundle, verification, and artifact upload
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - name: Cache the cargo registry and the build directory
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check the formatting
        run: cargo fmt --all --check

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run the test suite
        run: cargo test --workspace

      - name: Build the application bundle
        run: ./scripts/bundle-macos.sh

      - name: Verify the application bundle
        run: ./scripts/verify-distribution.sh --launch

      - name: Render one frame through the shot example
        run: |
          cargo run --release --example shot -- /tmp/ci-shot.png
          test -s /tmp/ci-shot.png
          ls -l /tmp/ci-shot.png

      - name: Upload the bundle and the rendered frame
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-bundle-and-shot
          path: |
            dist/Bible.app
            /tmp/ci-shot.png
          if-no-files-found: error
