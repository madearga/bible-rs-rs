[package]
name = "bible-app"
description = "The reader window, the themes, the offscreen render harness, and the command line"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "bible"
path = "src/main.rs"

[dependencies]
bible-core = { path = "../core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.36", features = [
    "default_fonts",
    "glow",
    "wgpu",
    "wayland",
    "x11",
    "accesskit",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSAccessibility",
    "NSWorkspace",
] }

[lints.rust]
unsafe_code = "forbid"
