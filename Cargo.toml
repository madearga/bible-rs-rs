[workspace]
resolver = "3"
members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["madearga"]
repository = "https://github.com/madearga/bible-rs-rs"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
zstd = "0.13"
